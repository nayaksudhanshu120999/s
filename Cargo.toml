[package]
name = "cmdpal-rs"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight prefix-free Command Palette in Rust and Slint"
authors = ["System Architect"]

[dependencies]
slint = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-femtovg",
] }
fuzzy-matcher = "0.3.7"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
walkdir = "2.5"
urlencoding = "2.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.8"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
